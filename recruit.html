<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>中级消防设施操作员 · 培训招生｜消防通</title>
  <meta name="description" content="昆明智德谦教育服务有限公司 · 中级消防设施操作员（监控/维保）培训招生，自有实操场地，老师负责，通过率高。" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: #f2f0eb; color: #2b2b2b; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 14px; background: #c0161c; color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
    .topbar a { color: #fff; text-decoration: none; font-size: 14px; }
    .topbar .ttl { font-weight: 700; font-size: 15px; }
    .poster { display: block; width: 100%; max-width: 480px; margin: 14px auto 90px; border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.12); }
    .save-tip { text-align: center; font-size: 13px; color: #8a8178; margin: -70px auto 14px; max-width: 90%; line-height: 1.6; }
    .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; gap: 10px; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: #fff; border-top: 1px solid #eee5d8; }
    .bar a { flex: 1; text-align: center; text-decoration: none; font-size: 15px; font-weight: 700; padding: 12px 0; border-radius: 10px; }
    .bar .save { color: #c0161c; border: 1.5px solid #c0161c; }
    .bar .wx { color: #fff; background: #c0161c; }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="index.html">‹ 返回首页</a>
    <span class="ttl">培训招生</span>
  </div>

  <img class="poster" src="assets/images/recruit-poster.png" alt="中级消防设施操作员培训招生海报" />

  <div class="save-tip">长按上方海报可保存图片，转发朋友圈 / 学员群更方便</div>

  <div class="bar">
    <a class="save" href="assets/images/recruit-poster.png" download="中级消防设施操作员培训招生.png">保存海报</a>
    <a class="wx" href="index.html#contact">加老师微信 ›</a>
  </div>
</body>
</html>
