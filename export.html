<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>题库导出工具 · 中级消防设施操作员</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f2f5f8; color: #1f2d3d; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; }
  .card { background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #8a94a6; font-size: 13px; margin: 0 0 18px; }
  .back { display: inline-block; font-size: 13px; color: #2f7d4f; text-decoration: none; margin-bottom: 12px; }
  .group { margin-bottom: 18px; }
  .group > label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 8px; }
  .opts { display: flex; flex-wrap: wrap; gap: 10px; }
  .opt { position: relative; }
  .opt input { position: absolute; opacity: 0; }
  .opt span { display: inline-block; padding: 9px 16px; border: 1.5px solid #d8dee6; border-radius: 10px; font-size: 14px; cursor: pointer; user-select: none; background: #fafbfc; }
  .opt input:checked + span { border-color: #2f7d4f; background: #eaf6ee; color: #1d5b38; font-weight: 600; }
  .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; background: #2f7d4f; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
  .btn:active { transform: scale(.99); }
  .info { margin-top: 14px; font-size: 13px; color: #8a94a6; min-height: 18px; }
  .info b { color: #1d5b38; }
  .tip { font-size: 12px; color: #a0a8b5; margin-top: 6px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="scripts/gen-code.html">← 返回老师发码工具</a>
  <div class="card">
    <h1>题库导出工具</h1>
    <p class="sub">纯浏览器导出，无需服务器。导出后文件直接下载到你的电脑/手机。</p>

    <div class="group">
      <label>导出方向</label>
      <div class="opts" id="dirOpts">
        <label class="opt"><input type="radio" name="dir" value="monitor" checked><span>监控方向</span></label>
        <label class="opt"><input type="radio" name="dir" value="maintain"><span>维保方向</span></label>
        <label class="opt"><input type="radio" name="dir" value="both"><span>双方向（监控+维保）</span></label>
      </div>
    </div>

    <div class="group">
      <label>题型</label>
      <div class="opts" id="typeOpts">
        <label class="opt"><input type="radio" name="type" value="all" checked><span>全部</span></label>
        <label class="opt"><input type="radio" name="type" value="single"><span>单选题</span></label>
        <label class="opt"><input type="radio" name="type" value="multiple"><span>多选题</span></label>
        <label class="opt"><input type="radio" name="type" value="judge"><span>判断题</span></label>
      </div>
    </div>

    <div class="group">
      <label>导出格式</label>
      <div class="opts" id="fmtOpts">
        <label class="opt"><input type="radio" name="fmt" value="doc" checked><span>Word 文档 (.doc)</span></label>
        <label class="opt"><input type="radio" name="fmt" value="txt"><span>纯文本 (.txt)</span></label>
      </div>
    </div>

    <button class="btn" id="exportBtn">导出题库</button>
    <div class="info" id="info"></div>
    <p class="tip">提示：Word 文档用电脑上的 Word / WPS 打开最整齐；手机可用 WPS 打开。<br>双方向导出题量较大（约 1700 题），生成需几秒，请耐心等待。</p>
  </div>
</div>

<script src="assets/js/bank.js"></script>
<script src="assets/js/bank_maintain.js"></script>
<script>
  var TYPE_NAME = { single: '单选题', multiple: '多选题', judge: '判断题' };

  function getVal(name) {
    var els = document.querySelectorAll('input[name="' + name + '"]');
    for (var i = 0; i < els.length; i++) if (els[i].checked) return els[i].value;
    return null;
  }

  // 汇总题目：返回 [{dir, type, question, options, answer, explanation}]
  function collect(dir, type) {
    var banks = [];
    if (dir === 'monitor' || dir === 'both') banks.push(window.BANK);
    if (dir === 'maintain' || dir === 'both') banks.push(window.BANK_MAINTAIN);
    var out = [];
    banks.forEach(function (b) {
      (b.chapters || []).forEach(function (ch) {
        if (type !== 'all' && ch.type !== type) return;
        (ch.questions || []).forEach(function (q) {
          out.push({
            dir: b.title || b.direction,
            type: ch.type,
            question: q.question,
            options: q.options,
            answer: q.answer,
            explanation: q.explanation
          });
        });
      });
    });
    return out;
  }

  function clean(s) {
    return (s == null ? '' : String(s)).replace(/\r?\n/g, '').replace(/\s+/g, ' ').trim();
  }

  // 答案完整文本，如 "B（预作用系统）"
  function answerText(q) {
    var ans = q.answer || '';
    var parts = q.options.filter(function (o) { return ans.indexOf(o.value) >= 0; })
                         .map(function (o) { return o.value + '（' + clean(o.text) + '）'; });
    return parts.length ? parts.join('；') : ans;
  }

  function toText(list, dirLabel) {
    var s = '中级消防设施操作员 — ' + dirLabel + '题库（共 ' + list.length + ' 题）\n\n';
    list.forEach(function (q, i) {
      s += (i + 1) + '. 【' + TYPE_NAME[q.type] + '】' + clean(q.question) + '\n';
      q.options.forEach(function (o) {
        s += '   ' + o.value + '. ' + clean(o.text) + '\n';
      });
      s += '【答案】' + answerText(q) + '\n';
      if (q.explanation) s += '【解析】' + clean(q.explanation) + '\n';
      s += '\n';
    });
    return s;
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function toHtml(list, dirLabel) {
    var h = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">';
    h += '<head><meta charset="utf-8"><title>' + esc(dirLabel) + '题库</title></head><body>';
    h += '<h2>中级消防设施操作员 — ' + esc(dirLabel) + '题库（共 ' + list.length + ' 题）</h2>';
    list.forEach(function (q, i) {
      h += '<p><b>' + (i + 1) + '. 【' + TYPE_NAME[q.type] + '】' + esc(clean(q.question)) + '</b></p>';
      q.options.forEach(function (o) {
        var mark = (q.answer || '').indexOf(o.value) >= 0 ? ' <font color="#2f7d4f"><b>●</b></font>' : '';
        h += '<p style="margin:2px 0 2px 16px;">' + o.value + '. ' + esc(clean(o.text)) + mark + '</p>';
      });
      h += '<p style="margin:2px 0 2px 16px;color:#1d5b38;"><b>答案：</b>' + esc(answerText(q)) + '</p>';
      if (q.explanation) h += '<p style="margin:2px 0 10px 16px;color:#666;"><b>解析：</b>' + esc(clean(q.explanation)) + '</p>';
    });
    h += '</body></html>';
    return h;
  }

  function download(filename, content, mime) {
    var blob = new Blob(['\ufeff' + content], { type: mime + ';charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  document.getElementById('exportBtn').addEventListener('click', function () {
    var dir = getVal('dir'), type = getVal('type'), fmt = getVal('fmt');
    if (!window.BANK && !window.BANK_MAINTAIN) {
      document.getElementById('info').textContent = '题库数据未加载，请刷新页面重试。';
      return;
    }
    var dirLabel = dir === 'monitor' ? '监控方向' : dir === 'maintain' ? '维保方向' : '双方向';
    var list = collect(dir, type);
    if (!list.length) { document.getElementById('info').textContent = '没有匹配的题目。'; return; }
    document.getElementById('info').innerHTML = '已汇总 <b>' + list.length + '</b> 题，正在生成文件…';

    var stamp = new Date().toISOString().slice(0, 10);
    setTimeout(function () {
      try {
        if (fmt === 'txt') {
          download('消防设施操作员_' + dirLabel + '_' + stamp + '.txt', toText(list, dirLabel), 'text/plain');
        } else {
          download('消防设施操作员_' + dirLabel + '_' + stamp + '.doc', toHtml(list, dirLabel), 'application/msword');
        }
        document.getElementById('info').innerHTML = '✓ 已导出 <b>' + list.length + '</b> 题，文件已开始下载。';
      } catch (e) {
        document.getElementById('info').textContent = '导出失败：' + e.message;
      }
    }, 50);
  });
</script>
</body>
</html>
