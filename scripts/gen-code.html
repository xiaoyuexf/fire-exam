<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>激活码生成工具（老师专用，本地使用）</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f4f8; color: #1f2937; margin: 0; padding: 24px; }
  .wrap { max-width: 480px; margin: 0 auto; background: #fff; border-radius: 14px; padding: 24px; box-shadow: 0 6px 24px rgba(0,0,0,.08); }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #6b7280; font-size: 13px; margin-bottom: 18px; }
  label { display: block; font-size: 14px; margin: 14px 0 6px; font-weight: 600; }
  select, input { width: 100%; padding: 11px 12px; border: 1px solid #d1d5db; border-radius: 9px; font-size: 15px; background: #fff; }
  button { margin-top: 18px; width: 100%; padding: 13px; border: 0; border-radius: 9px; background: #1a56db; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
  button:active { background: #1544b0; }
  .result { margin-top: 18px; padding: 16px; background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 10px; display: none; }
  .result.show { display: block; }
  .code { font-size: 22px; font-weight: 700; letter-spacing: 1px; color: #047857; word-break: break-all; }
  .meta { font-size: 13px; color: #065f46; margin-top: 8px; }
  .copy { margin-top: 10px; display: inline-block; padding: 7px 14px; background: #047857; color: #fff; border-radius: 7px; font-size: 13px; cursor: pointer; border: 0; }
  .warn { margin-top: 16px; font-size: 12px; color: #b45309; background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 10px; }
  .tier-btn { background: #047857; margin-top: 12px; }
  .tier-btn:active { background: #03654a; }
  .tier-result { margin-top: 16px; padding: 16px; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 10px; display: none; }
  .tier-result.show { display: block; }
  .tier-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px dashed #dbeafe; }
  .tier-row:last-child { border-bottom: 0; }
  .tier-label { font-size: 14px; font-weight: 600; color: #1e3a8a; min-width: 64px; }
  .tier-code { font-size: 15px; font-weight: 700; color: #1d4ed8; letter-spacing: .5px; word-break: break-all; flex: 1; margin: 0 10px; }
  .tier-copy { padding: 5px 10px; background: #1d4ed8; color: #fff; border: 0; border-radius: 6px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .tier-copyall { margin-top: 12px; display: inline-block; padding: 8px 14px; background: #1e3a8a; color: #fff; border: 0; border-radius: 7px; font-size: 13px; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <h1>激活码生成工具</h1>
  <div class="sub">老师本地使用 · 不依赖服务器 · 生成后发给学员</div>

  <label>方向</label>
  <select id="dir">
    <option value="monitor">监控方向</option>
    <option value="maintain">维保方向</option>
    <option value="both">监控 + 维保（双方向）</option>
  </select>

  <label>有效期（月）</label>
  <input id="months" type="number" min="1" max="24" value="2" />

  <label>起始日（默认今天）</label>
  <input id="start" type="date" />

  <button id="gen">生成激活码</button>

  <div class="result" id="result">
    <div class="code" id="codeText"></div>
    <div class="meta" id="metaText"></div>
    <button class="copy" id="copy">复制激活码</button>
  </div>

  <button class="tier-btn" id="genTier">生成档位样例（1/2/3/6/12 个月）</button>

  <div class="tier-result" id="tierResult">
    <div id="tierList"></div>
    <button class="tier-copyall" id="copyAll">复制全部档位码</button>
  </div>

  <div class="warn">
    提示：激活码算法包含在校件和小程序包内，理论上可被技术逆向推算。因码有时效且你收款后才发放，实际风险低；如要绝对防伪造，需改用后端校验方案。
  </div>
</div>

<script>
// ===== 与小程序 utils/code.js 完全一致的算法 =====
const SALT = 'FXMINI2026'
const DIR_RMAP = { monitor: 'M', maintain: 'K', both: 'B' }
function checksum(str) {
  let h = 0
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) & 0xffff
  for (let i = 0; i < SALT.length; i++) h = (h * 31 + SALT.charCodeAt(i)) & 0xffff
  return h.toString(36).toUpperCase().padStart(4, '0').slice(-4)
}
function pad2(n) { return String(n).padStart(2, '0') }
function genCode(direction, months, baseDate) {
  const dir = DIR_RMAP[direction] || 'M'
  const monthsNum = parseInt(months, 10) || 1
  const base = baseDate ? new Date(baseDate + 'T00:00:00') : new Date()
  const expire = new Date(base.getFullYear(), base.getMonth() + monthsNum, base.getDate())
  const ymd = '' + expire.getFullYear() + pad2(expire.getMonth() + 1) + pad2(expire.getDate())
  const body = dir + monthsNum + '-' + ymd
  return body + '-' + checksum(body)
}

document.getElementById('gen').addEventListener('click', function () {
  const direction = document.getElementById('dir').value
  const months = document.getElementById('months').value
  const startVal = document.getElementById('start').value
  const code = genCode(direction, months, startVal || null)
  const parts = code.split('-')
  const ymd = parts[1]
  const expireText = ymd.slice(0, 4) + '-' + ymd.slice(4, 6) + '-' + ymd.slice(6, 8)
  const dirName = direction === 'monitor' ? '监控' : direction === 'maintain' ? '维保' : '监控+维保'
  document.getElementById('codeText').textContent = code
  document.getElementById('metaText').textContent = `方向：${dirName} · 有效期：${months} 个月 · 到期日：${expireText}`
  document.getElementById('result').classList.add('show')
})

document.getElementById('copy').addEventListener('click', function () {
  const t = document.getElementById('codeText').textContent
  navigator.clipboard.writeText(t).then(function () {
    alert('已复制：' + t)
  })
})

// ===== 档位样例：1/2/3/6/12 个月各生成一个码 =====
const TIER_MONTHS = [1, 2, 3, 6, 12]
document.getElementById('genTier').addEventListener('click', function () {
  const direction = document.getElementById('dir').value
  const startVal = document.getElementById('start').value || null
  const dirName = direction === 'monitor' ? '监控' : direction === 'maintain' ? '维保' : '监控+维保'
  const rows = []
  const allCodes = []
  TIER_MONTHS.forEach(function (m) {
    const code = genCode(direction, m, startVal)
    const ymd = code.split('-')[1]
    const expireText = ymd.slice(0, 4) + '-' + ymd.slice(4, 6) + '-' + ymd.slice(6, 8)
    rows.push({ m: m, code: code, expireText: expireText })
    allCodes.push(code)
  })
  const list = document.getElementById('tierList')
  list.innerHTML = ''
  rows.forEach(function (r, i) {
    const row = document.createElement('div')
    row.className = 'tier-row'
    row.innerHTML = '<span class="tier-label">' + r.m + '个月</span>' +
      '<span class="tier-code">' + r.code + '<br><span style="font-size:11px;font-weight:400;color:#64748b">到期 ' + r.expireText + '</span></span>' +
      '<button class="tier-copy" data-code="' + r.code + '">复制</button>'
    list.appendChild(row)
  })
  document.getElementById('tierResult').classList.add('show')
  // 绑定每行复制
  list.querySelectorAll('.tier-copy').forEach(function (btn) {
    btn.addEventListener('click', function () {
      const c = btn.getAttribute('data-code')
      navigator.clipboard.writeText(c).then(function () { alert('已复制：' + c) })
    })
  })
  // 复制全部
  document.getElementById('copyAll').onclick = function () {
    const text = '【' + dirName + '方向】\n' + allCodes.map(function (c, i) { return TIER_MONTHS[i] + '个月：' + c }).join('\n')
    navigator.clipboard.writeText(text).then(function () { alert('已复制全部 ' + allCodes.length + ' 个档位码') })
  }
})
</script>
</body>
</html>
